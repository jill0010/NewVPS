name: Inventory captured page routes

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/inventory-captured-routes.py'
      - 'extracted/**/index.html'
      - '.github/workflows/inventory-captured-routes.yml'

permissions:
  contents: write

concurrency:
  group: captured-route-inventory
  cancel-in-progress: false

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build canonical route inventory from captured HTML
        run: python3 scripts/inventory-captured-routes.py
      - name: Publish route inventory
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- reports/captured-route-inventory.csv
          if git diff --cached --quiet; then
            echo 'Route inventory unchanged.'
          else
            git commit -m 'Update captured page route inventory'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
