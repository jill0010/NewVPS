name: Publish captured preview to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'extracted/**'
      - 'preview-pages/**'
      - 'scripts/build-captured-preview.py'
      - 'scripts/audit-preview-resources.py'
      - 'scripts/inventory-captured-routes.py'
      - 'reports/captured-route-inventory.csv'
      - '.github/workflows/publish-captured-preview.yml'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: captured-pages-preview
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build archived preview
        run: |
          python3 scripts/inventory-captured-routes.py
          python3 scripts/build-captured-preview.py
      - name: Commit missing-route audit to repository
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- reports/captured-preview-missing-links.csv
          if git diff --cached --quiet; then
            echo 'Missing-route audit unchanged.'
          else
            git commit -m 'Update NewVPS missing-route audit'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Upload missing-route audit
        uses: actions/upload-artifact@v4
        with:
          name: newvps-missing-routes
          path: reports/captured-preview-missing-links.csv
          retention-days: 14
      - name: Exclude redundant raw archive copies from Pages upload
        run: |
          # The authoritative captures remain unchanged under extracted/ in Git.
          # Their duplicate comparison copies need not be published to Pages.
          rm -rf dist-captured/original-captures
          # Order snapshots remain available from the archived source repository.
          rm -rf dist-captured/archived-order
          python3 - <<'PY'
          from pathlib import Path
          root=Path('dist-captured')
          files=[p for p in root.rglob('*') if p.is_file()]
          print(f'Publishing {len(files)} files, {sum(p.stat().st_size for p in files):,} uncompressed bytes')
          PY
      - name: Rewrite absolute paths for GitHub Pages project subdirectory
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          root = Path('dist-captured')
          base = '/NewVPS'
          from urllib.parse import urlsplit
          from html.parser import HTMLParser
          route_count = 0
          for file in root.rglob('index.html'):
              content = file.read_text(encoding='utf-8')
              for origin in ('https://anonport.com/', 'http://anonport.com/',
                             'https://www.anonport.com/', 'http://www.anonport.com/'):
                  for attr in ('href', 'action'):
                      for quote in ('"', "'"):
                          content = content.replace(f'{attr}={quote}{origin}',
                                                    f'{attr}={quote}{base}/')
              for attr in ('href', 'src', 'action', 'poster', 'data-src', 'data-href', 'data-poster'):
                  for quote in ('"', "'"):
                      needle = f'{attr}={quote}/'
                      content = content.replace(needle, f'{attr}={quote}{base}/')
                      content = content.replace(f'{attr}={quote}{base}{base}/',
                                                f'{attr}={quote}{base}/')
              # Responsive and lazy-loaded images also need the project prefix.
              for attr in ('srcset', 'imagesrcset', 'data-srcset'):
                  for quote in ('"', "'"):
                      pattern = re.compile(r'(' + re.escape(attr + '=' + quote) + r')([^' + re.escape(quote) + r']*)' + re.escape(quote))
                      def rewrite_sources(match):
                          candidates = match.group(2).split(',')
                          updated = []
                          for candidate in candidates:
                              parts = candidate.strip().split(None, 1)
                              if parts and parts[0].startswith('/') and not parts[0].startswith(base + '/'):
                                  parts[0] = base + parts[0]
                              updated.append(' '.join(parts))
                          return match.group(1) + ', '.join(updated) + quote
                      content = pattern.sub(rewrite_sources, content)
              # Preserve original absolute image references as local archive resources
              # when the page already carries a captured hashed asset.
              # Fix URLs in inline styles using the same project prefix.
              content = re.sub(r'url\\(\\s*([\\"\\\']?)\\/(?!NewVPS/)([^)\\"\\\']+)\\1\\s*\\)',
                               lambda m: 'url(' + m.group(1) + base + '/' + m.group(2) + m.group(1) + ')',
                               content)
              for token in ('url(/', 'url("/', "url('/"):
                  content = content.replace(token, token[:-1] + base + '/')
              content = content.replace('/_captures/', base + '/_captures/')
              content = content.replace(base + base + '/_captures/', base + '/_captures/')
              file.write_text(content, encoding='utf-8')
              route_count += 1
          print(f'Prepared {route_count} archived pages for GitHub Pages navigation')
          (root / '.nojekyll').touch()
          PY
      - name: Audit every archived page and CSS asset
        run: python3 scripts/audit-preview-resources.py || true
      - name: Upload resource audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newvps-resource-audit
          path: reports/newvps-resource-audit.csv
          if-no-files-found: ignore
      - name: Verify preview entry and representative routes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root = Path('dist-captured')
          required = ['index.html', 'vps/index.html', 'dedicated/index.html', 'gpu/index.html', 'guides/index.html', 'locations/index.html', 'missing-routes.csv']
          for rel in required:
              path = root / rel
              if not path.is_file() or not path.stat().st_size:
                  raise SystemExit(f'Missing preview output: {rel}')
              print(f'OK: {rel} ({path.stat().st_size} bytes)')
          pages = list(root.rglob('index.html'))
          if len(pages) < 174:
              raise SystemExit(f'Expected at least 174 preview HTML pages, got {len(pages)}')
          print(f'OK: {len(pages)} preview entry pages')
          PY
      - uses: actions/configure-pages@v5
      - name: Remove duplicate Pages artifacts before upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts?per_page=100" --jq '.artifacts[] | select(.name == "github-pages") | .id' | while read -r artifact_id; do
            gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/${artifact_id}"
          done
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-captured
      - id: deployment
        uses: actions/deploy-pages@v4
