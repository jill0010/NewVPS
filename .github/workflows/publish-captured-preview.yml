name: Publish captured preview to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/build-captured-preview.py'
      - 'scripts/inventory-captured-routes.py'
      - 'reports/captured-route-inventory.csv'
      - '.github/workflows/publish-captured-preview.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: captured-pages-preview
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build archived preview
        run: |
          python3 scripts/inventory-captured-routes.py
          python3 scripts/build-captured-preview.py
      - name: Rewrite absolute paths for GitHub Pages project subdirectory
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          root = Path('dist-captured')
          base = '/NewVPS'
          from urllib.parse import urlsplit
          from html import unescape
          route_count = 0
          for file in root.rglob('index.html'):
              content = file.read_text(encoding='utf-8')
              # Keep archived source metadata, but send internal navigation to this preview.
              for origin in ('https://anonport.com/', 'http://anonport.com/',
                             'https://www.anonport.com/', 'http://www.anonport.com/'):
                  for attr in ('href', 'action'):
                      for quote in ('"', "'"):
                          content = content.replace(f'{attr}={quote}{origin}',
                                                    f'{attr}={quote}{base}/')
              # Rewrite root-relative links exactly once; never rewrite protocol-relative URLs.
              for attr in ('href', 'src', 'action', 'poster'):
                  for quote in ('"', "'"):
                      needle = f'{attr}={quote}/'
                      content = content.replace(needle, f'{attr}={quote}{base}/')
                      content = content.replace(f'{attr}={quote}{base}{base}/',
                                                f'{attr}={quote}{base}/')
              for token in ('url(/', 'url("/', "url('/"):
                  content = content.replace(token, token[:-1] + base + '/')
              content = content.replace('/_captures/', base + '/_captures/')
              content = content.replace(base + base + '/_captures/', base + '/_captures/')
              file.write_text(content, encoding='utf-8')
              route_count += 1
          print(f'Prepared {route_count} archived pages for GitHub Pages navigation')
          (root / '.nojekyll').touch()
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-captured
      - id: deployment
        uses: actions/deploy-pages@v4
