name: NewVPS Payment Telegram Notifications

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: read

concurrency:
  group: newvps-payment-notifications
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Send queued order and payment notifications
        env:
          MONITOR_SECRET: ${{ secrets.NEWVPS_MONITOR_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "$MONITOR_SECRET" ]; then
            echo "::error::Configure repository secret NEWVPS_MONITOR_SECRET"
            exit 1
          fi
          curl --fail-with-body --retry 2 --retry-delay 3 --max-time 60 \
            -X POST \
            -H "Content-Type: application/json" \
            -H "x-monitor-secret: $MONITOR_SECRET" \
            -d '{}' \
            "https://gvsnbmejydgzqzzjyykt.supabase.co/functions/v1/payment-notifier"
