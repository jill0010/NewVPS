name: Repair NewVPS Telegram Webhook
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Re-register Telegram webhook with rotated monitor secret
        env:
          MONITOR_SECRET: ${{ secrets.NEWVPS_MONITOR_SECRET }}
        run: |
          set -euo pipefail
          test -n "$MONITOR_SECRET"
          curl --fail-with-body --retry 2 --max-time 30 \
            -X POST \
            -H "Content-Type: application/json" \
            -H "x-monitor-secret: $MONITOR_SECRET" \
            -d '{"action":"setup"}' \
            "https://gvsnbmejydgzqzzjyykt.supabase.co/functions/v1/quote-notice"
