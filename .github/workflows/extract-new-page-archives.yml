name: Extract newly captured page archives

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/extract-new-page-archives.yml'
      - '竞争对手对比页面.rar'
      - '技术指南页面.rar'
      - '产品与国家详情页面.rar'
      - '其他页面.rar'
      - '订单页面.rar'

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install 7-Zip
        run: |
          sudo apt-get update
          sudo apt-get install -y 7zip
      - name: Validate all archives before extraction
        shell: bash
        run: |
          set -euo pipefail
          for archive in '竞争对手对比页面.rar' '技术指南页面.rar' '产品与国家详情页面.rar' '其他页面.rar' '订单页面.rar'; do
            echo "::group::Validate $archive"
            test -f "$archive"
            7z t "$archive"
            echo "::endgroup::"
          done
      - name: Extract into separate immutable source directories
        shell: bash
        run: |
          set -euo pipefail
          names=('竞争对手对比页面' '技术指南页面' '产品与国家详情页面' '其他页面' '订单页面')
          folders=('competitor-comparisons' 'technical-guides' 'product-location-details' 'other-pages' 'order-pages')
          for i in "${!names[@]}"; do
            destination="extracted/new-captures/${folders[$i]}"
            mkdir -p "$destination"
            7z x -y -o"$destination" "${names[$i]}.rar"
          done
          python3 - <<'PY'
          from pathlib import Path
          base = Path('extracted/new-captures').resolve()
          for p in base.rglob('*'):
              if p.is_symlink() or not p.resolve().is_relative_to(base):
                  raise SystemExit(f'Unsafe archive entry: {p}')
          for folder in sorted(base.iterdir()):
              print(folder.name, sum(p.is_file() for p in folder.rglob('*')), 'files')
          PY
      - name: Commit extracted originals to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- extracted/new-captures/
          if git diff --cached --quiet; then
            echo 'No new extracted files.'
          else
            git commit -m 'Extract validated page archives without editing originals'
            git push origin HEAD:main
          fi
