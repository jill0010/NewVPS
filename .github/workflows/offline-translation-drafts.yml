name: Build Offline RU-ZH Translation Drafts

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/offline-translation-drafts.yml'

permissions:
  contents: read

jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
      - name: Build original captured pages
        run: |
          python3 scripts/inventory-captured-routes.py
          python3 scripts/build-captured-preview.py
          python3 scripts/extract-static-translations.py
      - name: Verify translation script Python syntax before installing models
        run: python3 -m py_compile scripts/generate-offline-translation-drafts.py
      - name: Install offline translation engine
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install argostranslate
      - name: Generate Russian and Simplified Chinese drafts without modifying website
        run: |
          python3 scripts/generate-offline-translation-drafts.py --all-routes --limit 900 --existing translations/drafts/core-batch-001.json --existing translations/drafts/core-batch-002.json --existing translations/drafts/core-batch-003.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('translation-catalog')
          report=json.loads((root/'draft-report.json').read_text(encoding='utf-8'))
          draft=json.loads((root/'draft-translations.json').read_text(encoding='utf-8'))
          assert report['requested_strings'] >= 0
          assert len(draft) == len([key for key,value in draft.items() if any(value.get(lang) for lang in ('ru','zh-CN'))])
          print('Actual new translated strings:',len(draft))
          print('Translation counts:',report['completed'])
          print('Unresolved translations:',len(report['failed']))
          if not draft:
              print('NO PROGRESS: archived drafts are retained; remaining text requires terminology-aware review, not repeated Argos retries.')
          else:
              print('WARNING: new machine-generated translations require review before publication')
          PY
      - name: Upload actual RU-ZH translated drafts and QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offline-ru-zh-drafts
          path: |
            translation-catalog/draft-translations.json
            translation-catalog/draft-report.json
            translation-catalog/coverage.json
          if-no-files-found: warn
          retention-days: 30
